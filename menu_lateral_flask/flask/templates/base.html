<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{% block title %}{% endblock %} - Flask Menu</title>
</head>
<body>
    <div class="menu">
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">Quem sou eu?</a></li>
                <li><a href="{{ url_for('page1') }}">Projetos para o futuro</a></li>
                <li><a href="{{ url_for('page2') }}">O que você gosto de fazer</a></li>
            </ul>
        </nav>
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
